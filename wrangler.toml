name = "website-marketplace-v26"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]
main = "./worker/index.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [
  "/*",
  "!/*.png",
  "!/*.svg",
  "!/*.webp",
  "!/*.jpg",
  "!/*.jpeg",
  "!/*.gif",
  "!/*.ico",
  "!/*.css",
  "!/*.js",
  "!/*.map",
  "!/*.woff",
  "!/*.woff2",
  "!/*.ttf",
  "!/*.eot",
  "!/*.json",
  "!/*.txt",
  "!/*.avif",
  "!/*.mp4",
  "!/*.webm"
]

[vars]
ASSET_BASE_URL = "/"
PROJECT = "your-project"
SEO_TTL = "300"
FIRST_LOAD_TTL = "300"
HARD_TTL = "86400"
DISABLE_CACHE = "false"
MAX_RESPONSE_BYTES = "2097152"
SEO_TIMEOUT_MS = "3000"
FIRST_LOAD_TIMEOUT_MS = "4000"
SITEMAP_TTL = "3600"
SITEMAP_TIMEOUT_MS = "8000"
USE_PROJECT_SUBDOMAIN = "true"
USE_PROJECT_DOMAIN = "true"
DISABLE_POWERED_BY = "true"

